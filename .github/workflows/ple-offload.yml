name: PLE offload

# Tests the Qwen4Exp PLE disk / remote memory offload and builds its two
# images, docker/Dockerfile.ple_mem_server and docker/Dockerfile.dgx_spark.
#
# The DGX Spark image (arm64, CUDA 13) builds on GitHub's hosted arm64
# runner with vLLM's kernels taken from the upstream build of this branch's
# base commit, and without a GPU to test on. To build it on a DGX Spark
# instead, compiling the kernels and running the PLE tests on its GPU, set
# the repository variable DGX_SPARK_RUNNER to the self-hosted runner's labels
# as JSON, e.g. ["self-hosted", "linux", "ARM64", "dgx-spark"].
#
# Except for pull requests, the tested images are pushed to GitHub Container
# Registry as ghcr.io/<owner>/vllm-ple-mem-server and
# ghcr.io/<owner>/vllm-dgx-spark, tagged with the short commit and the branch
# name, or with the tag name and `latest` for `v*` tags.

on:
  push:
    branches: ['**']
    # Path filters do not apply to tag pushes.
    tags: ['v*']
    paths:
      - .github/workflows/ple-offload.yml
      - .github/workflows/scripts/free_disk_space.sh
      - .github/workflows/scripts/push_ghcr_image.sh
      - docker/Dockerfile
      - docker/Dockerfile.dgx_spark
      - docker/Dockerfile.ple_mem_server
      - docker/docker-bake.hcl
      - tools/install_ucx_from_source.sh
      - vllm/config/engram.py
      - vllm/models/qwen4_exp/**
      - tests/models/qwen4_exp/test_ple*.py
      - tests/model_executor/model_loader/test_skip_checkpoint_weights.py
  pull_request:
    paths:
      - .github/workflows/ple-offload.yml
      - .github/workflows/scripts/free_disk_space.sh
      - .github/workflows/scripts/push_ghcr_image.sh
      - docker/Dockerfile
      - docker/Dockerfile.dgx_spark
      - docker/Dockerfile.ple_mem_server
      - docker/docker-bake.hcl
      - tools/install_ucx_from_source.sh
      - vllm/config/engram.py
      - vllm/models/qwen4_exp/**
      - tests/models/qwen4_exp/test_ple*.py
      - tests/model_executor/model_loader/test_skip_checkpoint_weights.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PLE tests (CPU, UCX over TCP)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Free disk space for the CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install compilers and RDMA headers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            autoconf automake g++ libibverbs-dev librdmacm-dev libtool make \
            pkg-config

      - name: Build UCX
        run: |
          bash tools/install_ucx_from_source.sh "$HOME/ucx"
          echo "PKG_CONFIG_PATH=$HOME/ucx/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'

      # Precompiled kernels from the upstream commit this branch is based on.
      - name: Install vLLM
        run: |
          git fetch --no-tags https://github.com/vllm-project/vllm main
          base=$(git merge-base FETCH_HEAD HEAD)
          uv venv --python 3.12
          VLLM_USE_PRECOMPILED=1 VLLM_MAIN_CUDA_VERSION=13.0 \
          VLLM_PRECOMPILED_WHEEL_COMMIT="$base" \
            uv pip install -e . --torch-backend=cu130
          uv pip install -c requirements/test/cuda.txt pytest tblib

      - name: Check the UCX backend builds
        run: |
          .venv/bin/python -c "import vllm.models.qwen4_exp.common.ple_disk_reader \
            as r; r.load_extension(remote=True); \
            assert 'ucx' in r.available_remote_backends()"

      - name: Run PLE tests
        run: |
          .venv/bin/python -m pytest -v -rs \
            tests/models/qwen4_exp/test_ple_disk.py \
            tests/models/qwen4_exp/test_ple_disk_reader.py \
            tests/models/qwen4_exp/test_ple_remote_reader.py \
            tests/model_executor/model_loader/test_skip_checkpoint_weights.py
          .venv/bin/python -m pytest -v tests/test_config.py \
            -k "engram_disk or engram_remote"

  ple-mem-server-image:
    name: Memory server image (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build
        run: docker buildx bake -f docker/docker-bake.hcl ple-mem-server

      # No RDMA on hosted runners: run the server and the benchmark over UCX's
      # tcp transport inside the image, checking every row and that the
      # server rejects out-of-bounds and foreign-region accesses.
      - name: Smoke test
        run: |
          docker run --rm -e UCX_TLS=tcp --entrypoint bash \
            vllm-ple-mem-server:latest -c '
              set -e
              ucx_info -v
              ple_mem_server --host 127.0.0.1 --port 18515 --allow-tcp \
                --max-memory 1G 2> /tmp/server.log &
              server=$!
              for _ in $(seq 100); do
                grep -q listening /tmp/server.log && break
                sleep 0.1
              done
              cat /tmp/server.log
              ple_mem_bench --server 127.0.0.1:18515 --allow-tcp --bytes 64M \
                --region-bytes 16M --verify --probe --no-sweep \
                --ping-iters 1000 --step-rows 16,256 --step-iters 200
              kill "$server"
              wait "$server"'

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash .github/workflows/scripts/push_ghcr_image.sh \
            vllm-ple-mem-server:latest vllm-ple-mem-server
          docker logout ghcr.io

  dgx-spark-image:
    name: DGX Spark image (arm64, CUDA 13)
    # Never run pull requests from forks on a self-hosted Spark.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.DGX_SPARK_RUNNER || '"ubuntu-24.04-arm"') }}
    timeout-minutes: ${{ vars.DGX_SPARK_RUNNER != '' && 720 || 360 }}
    permissions:
      contents: read
      packages: write
    env:
      SELF_HOSTED: ${{ vars.DGX_SPARK_RUNNER != '' }}
      # load: build into the local Docker (self-hosted Spark). push: push
      # straight from BuildKit to GHCR and pull the image back for the
      # checks, so the hosted runner's disk never holds the build cache and
      # the image at once. build: pull requests on a hosted runner, which may
      # not push, only build.
      MODE: >-
        ${{ vars.DGX_SPARK_RUNNER != '' && 'load' ||
        github.event_name == 'pull_request' && 'build' || 'push' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Free disk space
        if: env.MODE != 'load'
        run: bash .github/workflows/scripts/free_disk_space.sh

      # A hosted runner (4 cores, 16 GB) cannot compile vLLM's kernels in
      # time, so it takes them from the upstream build of the commit this
      # branch is based on; a self-hosted Spark compiles them unless the
      # DGX_SPARK_USE_PRECOMPILED variable is 1.
      - name: Configure the build
        env:
          USE_PRECOMPILED: ${{ vars.DGX_SPARK_USE_PRECOMPILED }}
        run: |
          git fetch --no-tags https://github.com/vllm-project/vllm main
          {
            echo "VLLM_MERGE_BASE_COMMIT=$(git merge-base FETCH_HEAD HEAD)"
            echo "VLLM_BUILD_COMMIT=$GITHUB_SHA"
            echo "CI_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vllm-dgx-spark:ci-${GITHUB_SHA::12}"
            if [ "$SELF_HOSTED" = true ]; then
              echo "DGX_SPARK_USE_PRECOMPILED=$USE_PRECOMPILED"
            else
              echo "DGX_SPARK_USE_PRECOMPILED=1"
              echo "DGX_SPARK_MAX_JOBS=4"
              echo "DGX_SPARK_NVCC_THREADS=1"
            fi
          } >> "$GITHUB_ENV"

      # The docker-container builder can push without first copying the image
      # into Docker's image store.
      - name: Set up BuildKit
        if: env.MODE != 'load'
        run: docker buildx create --name ple-builder --driver docker-container --use

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build
        run: |
          root=$(docker info -f '{{.DockerRootDir}}')
          # Logs the disk usage every minute; its own process group, so that
          # killing it also ends its sleep, which would hold the log open.
          setsid bash -c 'while true; do
            echo "[disk $(date -u +%H:%M:%S)] $(df -h "$1" \
              | awk "NR == 2 {print \$3 \" used, \" \$4 \" free of \" \$2}")"
            sleep 60
          done' disk-monitor "$root" &
          monitor=$!
          trap 'kill -- "-$monitor"' EXIT
          case "$MODE" in
            load) args=() ;;
            push) args=(--provenance=false
                        --set "dgx-spark.output=type=registry"
                        --set "dgx-spark.tags=$CI_IMAGE") ;;
            build) args=(--set "dgx-spark.output=type=cacheonly") ;;
          esac
          docker buildx bake -f docker/docker-bake.hcl "${args[@]}" dgx-spark
          df -h "$root"

      - name: Pull the image for the checks
        if: env.MODE == 'push'
        run: |
          docker buildx rm ple-builder
          docker pull "$CI_IMAGE"
          docker tag "$CI_IMAGE" vllm:dgx-spark
          df -h "$(docker info -f '{{.DockerRootDir}}')"

      # Hosted runners have no GPU: the checks run on the CPU there.
      - name: Check CUDA 13 and the PLE reader
        if: env.MODE != 'build'
        run: |
          gpus=()
          if [ "$SELF_HOSTED" = true ]; then gpus=(--gpus all); fi
          docker run --rm "${gpus[@]}" -e SELF_HOSTED \
            --entrypoint python3 vllm:dgx-spark -c "
          import os
          import torch
          import vllm.models.qwen4_exp.common.ple_disk_reader as r
          assert torch.version.cuda.startswith('13.'), torch.version.cuda
          if os.environ['SELF_HOSTED'] == 'true':
              assert torch.cuda.is_available()
              print(torch.cuda.get_device_name(), torch.cuda.get_device_capability())
          r.load_extension(remote=True)
          assert 'ucx' in r.available_remote_backends()
          "
          docker run --rm --entrypoint bash vllm:dgx-spark -c '
            set -e
            ucx_info -v
            ls /opt/ucx/lib/ucx/libuct_ib_mlx5.so /opt/ucx/lib/ucx/libuct_rdmacm.so
            test -x /opt/ple_mem/bin/ple_mem_bench'

      # The remote tests build ple_mem_server from the installed package with
      # make, which the serving image does not need.
      - name: Run PLE tests on the GPU
        if: env.MODE == 'load'
        run: |
          docker run --rm --gpus all --ipc=host \
            -v "$PWD/tests:/workspace/tests:ro" \
            -v "$PWD/requirements/test/cuda.txt:/workspace/test-lock.txt:ro" \
            -w /workspace --entrypoint bash vllm:dgx-spark -c '
              set -e
              apt-get update -y
              apt-get install -y --no-install-recommends make
              uv pip install --system -c test-lock.txt pytest tblib
              python3 -m pytest -p no:cacheprovider -v -rs \
                tests/models/qwen4_exp/test_ple_disk.py \
                tests/models/qwen4_exp/test_ple_disk_reader.py \
                tests/models/qwen4_exp/test_ple_remote_reader.py'

      # Only images that passed the checks get the commit and branch tags; a
      # pushed image that failed them keeps just its ci-<commit> tag.
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          if [ "$MODE" = push ]; then
            bash .github/workflows/scripts/push_ghcr_image.sh --remote \
              "$CI_IMAGE" vllm-dgx-spark
          else
            bash .github/workflows/scripts/push_ghcr_image.sh \
              vllm:dgx-spark vllm-dgx-spark
          fi

      # A self-hosted Spark keeps its Docker config between jobs.
      - name: Log out of GHCR
        if: always() && github.event_name != 'pull_request'
        run: docker logout ghcr.io
